<meta name="color-scheme" content="light dark">
<script>
  // Apply a manual theme choice before first paint to avoid a flash.
  // The choice is kept only while the system theme is the same as when it was made.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if ((t === 'dark' || t === 'light') && localStorage.getItem('theme-system') === sys) {
        document.documentElement.setAttribute('data-theme', t);
      } else {
        localStorage.removeItem('theme');
        localStorage.removeItem('theme-system');
      }
    } catch (e) {}
  })();
</script>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function system() { return mq.matches ? 'dark' : 'light'; }
    function current() { return root.getAttribute('data-theme') || system(); }
    function save(t) {
      try {
        if (t) {
          localStorage.setItem('theme', t);
          localStorage.setItem('theme-system', system());
        } else {
          localStorage.removeItem('theme');
          localStorage.removeItem('theme-system');
        }
      } catch (e) {}
    }
    function label() {
      if (!btn) return;
      var next = current() === 'dark' ? 'light' : 'dark';
      btn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
      btn.setAttribute('title', 'Switch to ' + next + ' mode');
    }
    // A manual choice only overrides the system while it differs from it.
    // Picking the mode the system already uses hands control back to the system.
    if (btn) btn.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      if (next === system()) {
        root.removeAttribute('data-theme');
        save(null);
      } else {
        root.setAttribute('data-theme', next);
        save(next);
      }
      label();
    });
    // If the system theme has changed since the choice was made, follow the system again.
    function sync() {
      var savedSys = null;
      try { savedSys = localStorage.getItem('theme-system'); } catch (e) {}
      if (root.hasAttribute('data-theme') && savedSys !== system()) {
        root.removeAttribute('data-theme');
        save(null);
      }
      label();
    }
    if (mq.addEventListener) mq.addEventListener('change', sync);
    else if (mq.addListener) mq.addListener(sync);
    window.addEventListener('focus', sync);
    window.addEventListener('pageshow', sync);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) sync();
    });
    label();
  })();
</script>
